[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "willow-narrator"
version = "2.1"
description = "A companion narrator for blind builders working with AI coding agents"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.8"
keywords = ["accessibility", "blind", "screen-reader", "ai", "coding-agent",
            "claude-code", "ollama", "narration"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Adaptive Technologies",
    "Topic :: Software Development",
]

# Deliberately empty. Willow uses only the Python standard library, so there
# is nothing between a user and a working install - including the optional
# narration and describe modes, which talk to Anthropic, OpenAI or a local
# Ollama over plain urllib.
dependencies = []

[project.scripts]
willow = "willow:main"

[tool.setuptools]
py-modules = ["willow"]
