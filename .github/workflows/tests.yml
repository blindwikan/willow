name: Cross-platform checks
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: willow-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ['3.10', '3.11', '3.12', '3.13', '3.14', '3.15']
        include:
          - os: ubuntu-22.04
            python: '3.8'
          - os: ubuntu-22.04
            python: '3.9'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          check-latest: true
      - name: Upgrade compatible packaging tools
        run: python -m pip install --upgrade pip setuptools wheel build
      - name: Prepare local result tray
        run: python -c "import os; os.makedirs('.willow', exist_ok=True)"
      - name: Run regression suite through Willow
        run: python willow.py run python -m unittest discover
      - name: Run synthetic revisit evaluation
        run: python willow.py run python evaluate_memory.py
      - name: Build wheel and source distribution with current tools
        run: python willow.py run python -m build
      - name: Install and inspect the package
        run: python -m pip install --no-deps .
      - name: Check installed entry point
        run: willow --version
